<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Opportunities – DualDream Visa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo"><img src="images/logo.png" alt="Logo"></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="visas.html">Visa Types</a></li>
                    <li><a href="jobs.html">Jobs</a></li>
                    <li><a href="counselling.html">Free Counselling</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section>
        <h2 class="section-title animate fade-up">Visa Sponsorship Jobs (50+ Opportunities)</h2>
        <div id="jobsContainer" class="grid"></div>
    </section>

    <footer>
        <div class="footer-content">
            <div><h4>DualDream Visa</h4><p>Your US & Canada immigration partner</p></div>
            <div><p><a href="mailto:dualdreamvisa@gmail.com">dualdreamvisa@gmail.com</a></p><p><a href="https://wa.me/18624289126">WhatsApp +1 (862) 428-9126</a></p></div>
        </div>
        <p>&copy; 2025 DualDream Visa</p>
    </footer>

    <script src="js/jobs-data.js"></script>
    <script>
        const container = document.getElementById('jobsContainer');
        function renderJobs() {
            let html = '';
            jobs.forEach(job => {
                html += `
                    <div class="card animate fade-up">
                        <h3>${job.title}</h3>
                        <p><strong>${job.company}</strong> – ${job.location}</p>
                        <p>Visa: ${job.visaType}</p>
                        <p>${job.description.substring(0, 100)}...</p>
                        <a href="job-details.html?id=${job.id}" class="btn" style="background:var(--secondary); color:var(--primary); padding:10px 20px; text-decoration:none; display:inline-block;">View Details</a>
                    </div>
                `;
            });
            container.innerHTML = html;
            // re-trigger animation observer if needed
            document.querySelectorAll('.animate').forEach(el => el.classList.add('visible'));
        }
        renderJobs();
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
