<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel – DualDream Visa</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Tabs */
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 25px;
            border: none;
            background: #ddd;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
        }
        .tab-btn.active {
            background: var(--secondary);
            color: var(--primary);
        }
        /* Modal styles (same as before) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #0B1D3A;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            margin-top: 20px;
        }
        .detail-grid .label {
            font-weight: bold;
            color: #0B1D3A;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="adminApp"></div>

    <!-- Modal for detailed view -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h2 id="detailTitle">Details</h2>
            <div id="detailContent" class="detail-grid"></div>
        </div>
    </div>

    <script type="module">
        import { db, auth } from "./js/firebase-init.js";
        import { collection, getDocs, query, orderBy, where, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
        import { signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

        const appDiv = document.getElementById('adminApp');
        const modal = document.getElementById('detailModal');
        const detailContent = document.getElementById('detailContent');
        const detailTitle = document.getElementById('detailTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');

        closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });

        let allCounsellingDocs = [];
        let allJobDocs = [];
        let currentTab = 'counselling'; // default

        // Auth check
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const adminSnap = await getDocs(query(collection(db, "admins"), where("uid", "==", user.uid)));
                if (!adminSnap.empty) {
                    renderDashboard();
                } else {
                    appDiv.innerHTML = '<p>You are not authorized.</p>';
                    signOut(auth);
                }
            } else {
                renderLogin();
            }
        });

        function renderLogin() {
            appDiv.innerHTML = `
                <div class="admin-login-form card">
                    <h2>Admin Login</h2>
                    <div class="form-group"><input type="email" id="loginEmail" placeholder="Email" required></div>
                    <div class="form-group"><input type="password" id="loginPassword" placeholder="Password" required></div>
                    <button id="loginBtn" class="submit-btn">Login</button>
                    <p id="loginError" style="color:red;margin-top:10px;"></p>
                </div>
            `;
            document.getElementById('loginBtn').addEventListener('click', async () => {
                const email = document.getElementById('loginEmail').value;
                const pass = document.getElementById('loginPassword').value;
                try {
                    await signInWithEmailAndPassword(auth, email, pass);
                } catch (e) {
                    document.getElementById('loginError').textContent = "Invalid credentials.";
                }
            });
        }

        function showDetail(data, type) {
            let html = '';
            if (type === 'counselling') {
                html = `
                    <div class="label">Name</div><div>${data.name || ''}</div>
                    <div class="label">Mobile</div><div>${data.mobile || ''}</div>
                    <div class="label">Email</div><div>${data.email || ''}</div>
                    <div class="label">Country</div><div>${data.country || ''}</div>
                    <div class="label">City</div><div>${data.city || ''}</div>
                    <div class="label">Gender</div><div>${data.gender || ''}</div>
                    <div class="label">Date of Birth</div><div>${data.dob || ''}</div>
                    <div class="label">Qualification</div><div>${data.qualification || ''}</div>
                    <div class="label">Budget</div><div>${data.budget || ''}</div>
                    <div class="label">Purpose</div><div>${data.purpose || ''}</div>
                    <div class="label">Interested Country</div><div>${data.interestedCountry || ''}</div>
                    <div class="label">Summary</div><div>${data.summary || ''}</div>
                    <div class="label">Submitted</div><div>${data.createdAt ? new Date(data.createdAt.seconds*1000).toLocaleString() : ''}</div>
                `;
            } else if (type === 'job') {
                html = `
                    <div class="label">Job Title</div><div>${data.jobTitle || ''}</div>
                    <div class="label">Applicant Name</div><div>${data.name || ''}</div>
                    <div class="label">Email</div><div>${data.email || ''}</div>
                    <div class="label">Phone</div><div>${data.phone || ''}</div>
                    <div class="label">Country</div><div>${data.country || ''}</div>
                    <div class="label">Qualification</div><div>${data.qualification || ''}</div>
                    <div class="label">Experience</div><div>${data.experience || ''} years</div>
                    <div class="label">Cover Letter</div><div>${data.coverLetter || ''}</div>
                    <div class="label">CV File</div><div>${data.cvFileName || ''}</div>
                    <div class="label">Applied On</div><div>${data.appliedAt ? new Date(data.appliedAt.seconds*1000).toLocaleString() : ''}</div>
                `;
            }
            detailTitle.textContent = (type === 'counselling' ? 'Counselling Request' : 'Job Application') + ' Detail';
            detailContent.innerHTML = html;
            modal.style.display = 'flex';
        }

        async function renderDashboard() {
            // Fetch both collections
            const counsellingSnap = await getDocs(query(collection(db, "counselling"), orderBy("createdAt", "desc")));
            allCounsellingDocs = [];
            counsellingSnap.forEach(doc => allCounsellingDocs.push({ id: doc.id, ...doc.data() }));

            const jobSnap = await getDocs(query(collection(db, "job_applications"), orderBy("appliedAt", "desc")));
            allJobDocs = [];
            jobSnap.forEach(doc => allJobDocs.push({ id: doc.id, ...doc.data() }));

            appDiv.innerHTML = `
                <div style="max-width:1200px;margin:20px auto;padding:20px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <h2>Admin Panel</h2>
                        <button id="logoutBtn" class="logout-btn">Logout</button>
                    </div>
                    <div class="tab-container">
                        <button id="tabCounselling" class="tab-btn active">Counselling Requests</button>
                        <button id="tabJobs" class="tab-btn">Job Applications</button>
                    </div>
                    <div id="tabContent"></div>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

            // Tab switching
            document.getElementById('tabCounselling').addEventListener('click', () => switchTab('counselling'));
            document.getElementById('tabJobs').addEventListener('click', () => switchTab('jobs'));

            // Initial load
            switchTab('counselling');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabCounselling').classList.toggle('active', tab === 'counselling');
            document.getElementById('tabJobs').classList.toggle('active', tab === 'jobs');

            const contentDiv = document.getElementById('tabContent');
            if (tab === 'counselling') {
                renderCounsellingTab(contentDiv);
            } else {
                renderJobApplicationsTab(contentDiv);
            }
        }

        function renderCounsellingTab(container) {
            const docs = allCounsellingDocs;
            let html = `
                <div class="filter-bar">
                    <select id="filterCountry"><option value="">All Countries</option></select>
                    <select id="filterPurpose"><option value="">All Purposes</option></select>
                    <input type="text" id="searchBox" placeholder="Search name or email">
                </div>
                <button id="exportCSV" class="export-btn">Export CSV</button>
                <table class="dashboard-table">
                    <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Country</th><th>Purpose</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            `;
            container.innerHTML = html;

            const countries = [...new Set(docs.map(d => d.country))];
            const purposes = [...new Set(docs.map(d => d.purpose))];
            const countrySel = document.getElementById('filterCountry');
            const purposeSel = document.getElementById('filterPurpose');
            countries.forEach(c => { let opt = document.createElement('option'); opt.value = c; opt.textContent = c; countrySel.appendChild(opt); });
            purposes.forEach(p => { let opt = document.createElement('option'); opt.value = p; opt.textContent = p; purposeSel.appendChild(opt); });

            function renderTable(filteredDocs) {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                filteredDocs.forEach(d => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${d.createdAt ? new Date(d.createdAt.seconds*1000).toLocaleDateString() : ''}</td>
                        <td>${d.name || ''}</td>
                        <td>${d.email || ''}</td>
                        <td>${d.country || ''}</td>
                        <td>${d.purpose || ''}</td>
                        <td><select class="statusChange" data-id="${d.id}">
                            <option value="New" ${d.status==='New'?'selected':''}>New</option>
                            <option value="Contacted" ${d.status==='Contacted'?'selected':''}>Contacted</option>
                            <option value="Follow-up" ${d.status==='Follow-up'?'selected':''}>Follow-up</option>
                            <option value="Closed" ${d.status==='Closed'?'selected':''}>Closed</option>
                        </select></td>
                        <td>
                            <button class="viewBtn" data-id="${d.id}">View</button>
                            <button class="deleteBtn" data-id="${d.id}">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                attachCounsellingListeners(filteredDocs);
            }

            function applyFilters() {
                let filtered = docs;
                const cVal = document.getElementById('filterCountry').value;
                const pVal = document.getElementById('filterPurpose').value;
                const sVal = document.getElementById('searchBox').value.toLowerCase();
                if (cVal) filtered = filtered.filter(d => d.country === cVal);
                if (pVal) filtered = filtered.filter(d => d.purpose === pVal);
                if (sVal) filtered = filtered.filter(d => d.name?.toLowerCase().includes(sVal) || d.email?.toLowerCase().includes(sVal));
                renderTable(filtered);
            }
            document.getElementById('filterCountry').addEventListener('change', applyFilters);
            document.getElementById('filterPurpose').addEventListener('change', applyFilters);
            document.getElementById('searchBox').addEventListener('input', applyFilters);

            function attachCounsellingListeners(filteredDocs) {
                document.querySelectorAll('.statusChange').forEach(sel => {
                    sel.addEventListener('change', async (e) => {
                        const id = e.target.dataset.id;
                        await updateDoc(doc(db, "counselling", id), { status: e.target.value });
                    });
                });
                document.querySelectorAll('.viewBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        const data = docs.find(d => d.id === id);
                        if (data) showDetail(data, 'counselling');
                    });
                });
                document.querySelectorAll('.deleteBtn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if (confirm('Delete?')) {
                            await deleteDoc(doc(db, "counselling", e.target.dataset.id));
                            location.reload();
                        }
                    });
                });
            }

            renderTable(docs);

            // Export CSV
            document.getElementById('exportCSV').addEventListener('click', () => {
                const rows = [['Date','Name','Email','Mobile','Country','City','Gender','DOB','Qualification','Budget','Purpose','Interested Country','Summary','Status']];
                docs.forEach(d => {
                    const date = d.createdAt ? new Date(d.createdAt.seconds*1000).toISOString() : '';
                    rows.push([date, d.name, d.email, d.mobile, d.country, d.city, d.gender, d.dob, d.qualification, d.budget, d.purpose, d.interestedCountry, d.summary, d.status || 'New']);
                });
                let csv = "data:text/csv;charset=utf-8," + rows.map(r => r.join(",")).join("\n");
                const link = document.createElement("a");
                link.href = encodeURI(csv);
                link.download = "counselling_requests.csv";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }

        function renderJobApplicationsTab(container) {
            const docs = allJobDocs;
            let html = `
                <div class="filter-bar">
                    <select id="filterJobCountry"><option value="">All Countries</option></select>
                    <input type="text" id="searchJobBox" placeholder="Search name or email">
                </div>
                <button id="exportJobsCSV" class="export-btn">Export CSV</button>
                <table class="dashboard-table">
                    <thead><tr><th>Date</th><th>Job Title</th><th>Name</th><th>Email</th><th>Phone</th><th>Country</th><th>Actions</th></tr></thead>
                    <tbody id="jobsTableBody"></tbody>
                </table>
            `;
            container.innerHTML = html;

            const countries = [...new Set(docs.map(d => d.country))];
            const countrySel = document.getElementById('filterJobCountry');
            countries.forEach(c => { let opt = document.createElement('option'); opt.value = c; opt.textContent = c; countrySel.appendChild(opt); });

            function renderJobTable(filteredDocs) {
                const tbody = document.getElementById('jobsTableBody');
                tbody.innerHTML = '';
                filteredDocs.forEach(d => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${d.appliedAt ? new Date(d.appliedAt.seconds*1000).toLocaleDateString() : ''}</td>
                        <td>${d.jobTitle || ''}</td>
                        <td>${d.name || ''}</td>
                        <td>${d.email || ''}</td>
                        <td>${d.phone || ''}</td>
                        <td>${d.country || ''}</td>
                        <td>
                            <button class="viewJobBtn" data-id="${d.id}">View</button>
                            <button class="deleteJobBtn" data-id="${d.id}">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                attachJobListeners(filteredDocs);
            }

            function applyJobFilters() {
                let filtered = docs;
                const cVal = document.getElementById('filterJobCountry').value;
                const sVal = document.getElementById('searchJobBox').value.toLowerCase();
                if (cVal) filtered = filtered.filter(d => d.country === cVal);
                if (sVal) filtered = filtered.filter(d => d.name?.toLowerCase().includes(sVal) || d.email?.toLowerCase().includes(sVal));
                renderJobTable(filtered);
            }
            document.getElementById('filterJobCountry').addEventListener('change', applyJobFilters);
            document.getElementById('searchJobBox').addEventListener('input', applyJobFilters);

            function attachJobListeners(filteredDocs) {
                document.querySelectorAll('.viewJobBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        const data = docs.find(d => d.id === id);
                        if (data) showDetail(data, 'job');
                    });
                });
                document.querySelectorAll('.deleteJobBtn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        if (confirm('Delete?')) {
                            await deleteDoc(doc(db, "job_applications", e.target.dataset.id));
                            location.reload();
                        }
                    });
                });
            }

            renderJobTable(docs);

            // Export CSV for jobs
            document.getElementById('exportJobsCSV').addEventListener('click', () => {
                const rows = [['Date','Job Title','Name','Email','Phone','Country','Qualification','Experience','Cover Letter','CV File']];
                docs.forEach(d => {
                    const date = d.appliedAt ? new Date(d.appliedAt.seconds*1000).toISOString() : '';
                    rows.push([date, d.jobTitle, d.name, d.email, d.phone, d.country, d.qualification, d.experience, d.coverLetter, d.cvFileName]);
                });
                let csv = "data:text/csv;charset=utf-8," + rows.map(r => r.join(",")).join("\n");
                const link = document.createElement("a");
                link.href = encodeURI(csv);
                link.download = "job_applications.csv";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
    </script>
</body>
</html>
