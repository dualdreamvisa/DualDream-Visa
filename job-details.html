<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Detail – DualDream Visa</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modal styles same as admin page */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #0B1D3A;
        }
        .detail-item { margin-bottom: 15px; }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo"><img src="images/logo.png" alt="Logo"></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="visas.html">Visa Types</a></li>
                    <li><a href="jobs.html">Jobs</a></li>
                    <li><a href="counselling.html">Free Counselling</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="jobDetailContainer"></section>

    <!-- Apply Modal -->
    <div id="applyModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" id="closeModalBtn">&times;</span>
            <h2>Apply for <span id="jobTitleApply"></span></h2>
            <form id="applyForm">
                <input type="hidden" id="jobId" name="jobId">
                <input type="hidden" id="jobTitle" name="jobTitle">
                <div class="form-group"><label>Full Name *</label><input type="text" id="appName" required></div>
                <div class="form-group"><label>Email *</label><input type="email" id="appEmail" required></div>
                <div class="form-group"><label>Phone *</label><input type="tel" id="appPhone" required></div>
                <div class="form-group"><label>Country</label><input type="text" id="appCountry"></div>
                <div class="form-group"><label>Highest Qualification</label><input type="text" id="appQualification"></div>
                <div class="form-group"><label>Years of Experience</label><input type="number" id="appExperience" min="0"></div>
                <div class="form-group"><label>Cover Letter</label><textarea id="appCoverLetter" rows="3"></textarea></div>
                <div class="form-group"><label>Resume/CV (PDF/Word) *</label><input type="file" id="appCv" accept=".pdf,.doc,.docx" required></div>
                <button type="submit" class="submit-btn">Submit Application</button>
                <p id="applyMsg"></p>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div><h4>DualDream Visa</h4></div>
            <div><p><a href="mailto:dualdreamvisa@gmail.com">dualdreamvisa@gmail.com</a></p><p><a href="https://wa.me/18624289126">WhatsApp +1 (862) 428-9126</a></p></div>
        </div>
        <p>&copy; 2025 DualDream Visa</p>
    </footer>

    <script src="js/jobs-data.js"></script>
    <script type="module">
        import { db } from "./js/firebase-init.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        // Get job ID from URL
        const params = new URLSearchParams(window.location.search);
        const jobId = parseInt(params.get('id'));
        const job = jobs.find(j => j.id === jobId);

        const detailContainer = document.getElementById('jobDetailContainer');
        if (!job) {
            detailContainer.innerHTML = '<h2>Job not found</h2>';
        } else {
            detailContainer.innerHTML = `
                <h2 class="section-title">${job.title}</h2>
                <div class="card" style="margin-top:20px;">
                    <p><strong>Company:</strong> ${job.company}</p>
                    <p><strong>Location:</strong> ${job.location}</p>
                    <p><strong>Visa Type:</strong> ${job.visaType}</p>
                    <p><strong>Type:</strong> ${job.type}</p>
                    <p><strong>Salary:</strong> ${job.salary}</p>
                    <p><strong>Apply By:</strong> ${job.applyBy}</p>
                    <hr>
                    <p><strong>Description:</strong> ${job.description}</p>
                    <p><strong>Requirements:</strong></p>
                    <ul>${job.requirements.map(r => `<li>${r}</li>`).join('')}</ul>
                    <button id="applyBtn" class="submit-btn">Apply Now</button>
                </div>
            `;

            // Modal logic
            const modal = document.getElementById('applyModal');
            const closeBtn = document.getElementById('closeModalBtn');
            document.getElementById('applyBtn').addEventListener('click', () => {
                document.getElementById('jobTitleApply').textContent = job.title;
                document.getElementById('jobId').value = job.id;
                document.getElementById('jobTitle').value = job.title;
                modal.style.display = 'flex';
            });
            closeBtn.addEventListener('click', () => modal.style.display = 'none');
            window.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });

            // Form submit
            document.getElementById('applyForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fileInput = document.getElementById('appCv');
                const file = fileInput.files[0];
                if (!file) {
                    document.getElementById('applyMsg').textContent = 'Please upload your CV.';
                    return;
                }

                // Convert file to base64
                const reader = new FileReader();
                reader.onload = async (event) => {
                    const base64 = event.target.result;
                    const application = {
                        jobId: job.id,
                        jobTitle: job.title,
                        name: document.getElementById('appName').value,
                        email: document.getElementById('appEmail').value,
                        phone: document.getElementById('appPhone').value,
                        country: document.getElementById('appCountry').value,
                        qualification: document.getElementById('appQualification').value,
                        experience: document.getElementById('appExperience').value,
                        coverLetter: document.getElementById('appCoverLetter').value,
                        cvFileName: file.name,
                        cvBase64: base64,
                        appliedAt: serverTimestamp()
                    };
                    try {
                        await addDoc(collection(db, "job_applications"), application);
                        document.getElementById('applyMsg').textContent = 'Application submitted successfully!';
                        document.getElementById('applyForm').reset();
                    } catch (error) {
                        document.getElementById('applyMsg').textContent = 'Error: ' + error.message;
                    }
                };
                reader.onerror = () => {
                    document.getElementById('applyMsg').textContent = 'Error reading file.';
                };
                reader.readAsDataURL(file); // convert to base64 data URL
            });
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
